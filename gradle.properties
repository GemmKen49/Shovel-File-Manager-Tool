# Gradle gets one 5 GB heap; the Kotlin compiler runs inside it instead of starting a second 4 GB process.
org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
# Clean CI builds never reuse incremental caches, so skip building them.
kotlin.incremental=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
