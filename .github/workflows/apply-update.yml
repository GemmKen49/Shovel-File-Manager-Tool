name: Apply update

# One-time helper. Upload update.zip to the repo root, then run this workflow.
# It unpacks the zip over the repo, deletes the removed files, and commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unpack update.zip
        run: |
          set -euo pipefail
          test -f update.zip
          unzip -o update.zip
          rm update.zip

      - name: Delete removed files
        run: |
          set -euo pipefail
          # Tags feature
          rm -f app/src/main/java/com/affilemanager/app/data/FileTagRepository.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/data/FileTagRepositoryTest.kt
          # All translations except English
          rm -rf app/src/main/res/values-*
          rm -rf app/src/main/assets/i18n
          rm -f app/src/main/res/xml/locales_config.xml
          rm -f app/src/main/java/com/affilemanager/app/ui/localization/AppLanguageManager.kt
          rm -f app/src/main/java/com/affilemanager/app/ui/localization/UiTranslationCatalog.kt
          # Tests that only covered the removed language code
          rm -f app/src/test/java/com/affilemanager/app/ui/localization/UiTranslationAssetsTest.kt
          rm -f app/src/test/java/com/affilemanager/app/ui/localization/UiTranslatorTest.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/ui/localization/AllLanguageNavigationLayoutTest.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/ui/localization/LocalizedResourcesTest.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/ui/localization/UiTranslationCatalogTest.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/ui/localization/VisibleFeatureLocalizationUiTest.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/ui/preview/TranslatedPlaybackLayoutTest.kt
          rm -f app/src/androidTest/java/com/affilemanager/app/ui/components/DirectoryEntryFilterDialogTest.kt

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove tags, favourites and extra languages (English only)"
          git push
