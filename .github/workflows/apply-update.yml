name: Apply update

# One-time helper. Upload update.zip to the repo root, then run this workflow.
# It unpacks the zip over the repo, deletes the removed files, and commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unpack update.zip
        run: |
          set -euo pipefail
          test -f update.zip
          unzip -o update.zip
          rm update.zip

      - name: Delete removed files
        run: |
          set -euo pipefail
          B=app/src/main/java/com/shovel/filemanager
          T=app/src/androidTest/java/com/shovel/filemanager
          rm -f "$B/ui/theme/AppearanceWallpaper.kt"
          rm -f "$B/ui/screens/WallpaperSettings.kt"
          rm -f "$T/ui/theme/AppearanceWallpaperTest.kt"
          rm -f "$T/ui/theme/WallpaperUiTest.kt"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove built-in quick locations, wallpaper and transparency"
          git push
