name: Apply update

# Helper. Upload update.zip to the repo root, then run this workflow.
# It unpacks the zip over the repo and commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unpack update.zip
        run: |
          set -euo pipefail
          test -f update.zip
          unzip -o update.zip
          rm update.zip

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Faster folder details, clearer archive size limit errors"
          git push
