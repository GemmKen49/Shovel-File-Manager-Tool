name: Remove network

# One-time helper. Upload network-update.zip to the repo root, then run this workflow.
# It unpacks the zip, deletes the network and cloud code, and commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unpack network-update.zip
        run: |
          set -euo pipefail
          test -f network-update.zip
          unzip -o network-update.zip
          rm network-update.zip

      - name: Delete network files
        run: |
          set -euo pipefail
          B=app/src/main/java/com/shovel/filemanager
          rm -rf "$B/network"
          rm -f "$B/editing/RemoteEditSaver.kt"
          rm -f "$B/security/CredentialVault.kt"
          rm -f "$B/ui/RemoteBrowserRules.kt"
          rm -f "$B/ui/RemoteSelectionRules.kt"
          rm -f "$B/ui/preview/RemotePreviewCache.kt"
          rm -f "$B/ui/screens/ConnectionsScreen.kt"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove network and cloud features and the internet permission"
          git push
