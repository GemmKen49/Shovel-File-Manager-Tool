name: Remove benchmark

# One-time helper. Upload benchmark-update.zip to the repo root, then run this workflow.
# It unpacks the zip, deletes the benchmark module and its leftovers, and commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unpack benchmark-update.zip
        run: |
          set -euo pipefail
          test -f benchmark-update.zip
          unzip -o benchmark-update.zip
          rm benchmark-update.zip

      - name: Delete benchmark files
        run: |
          set -euo pipefail
          rm -rf benchmark
          rm -rf app/src/benchmark
          rm -f app/benchmark-proguard-rules.pro

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove benchmark module"
          git push
