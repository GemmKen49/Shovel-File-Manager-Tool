name: Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic

      - name: Build cloudflared component
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" >/dev/null
          bash scripts/build-cloudflared-android.sh

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AF_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-release.jks"

      - name: Build release APK
        env:
          AF_KEYSTORE_PATH: ${{ runner.temp }}/my-release.jks
          AF_KEYSTORE_PASSWORD: ${{ secrets.AF_KEYSTORE_PASSWORD }}
          AF_KEY_ALIAS: ${{ secrets.AF_KEY_ALIAS }}
          AF_KEY_PASSWORD: ${{ secrets.AF_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PafTargetAbi=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
