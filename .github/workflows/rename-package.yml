name: Rename package

# One-time helper. Renames com.affilemanager.app to com.shovel.filemanager
# (folders, package lines, imports, manifests, profiles) and commits the result.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rename package
        shell: bash
        run: |
          # Renames com.affilemanager.app -> com.shovel.filemanager across the whole repo.
          set -euo pipefail

          # 1. Move source directories.
          find . -type d -path '*/com/affilemanager' -not -path './.git/*' | while read -r dir; do
            parent="$(dirname "$dir")"
            mkdir -p "$parent/shovel/filemanager"
            if [ -d "$dir/app" ]; then
              cp -a "$dir/app/." "$parent/shovel/filemanager/"
              rm -rf "$dir/app"
            fi
            if [ -d "$dir/benchmark" ]; then
              mkdir -p "$parent/shovel/filemanager/benchmark"
              cp -a "$dir/benchmark/." "$parent/shovel/filemanager/benchmark/"
              rm -rf "$dir/benchmark"
            fi
            rmdir "$dir"
          done

          # 2. Rewrite every text file that mentions the old package.
          grep -rIl 'affilemanager' . --exclude-dir=.git | while read -r f; do
            sed -i \
              -e 's#com\.affilemanager\.app#com.shovel.filemanager#g' \
              -e 's#com\.affilemanager\.#com.shovel.filemanager.#g' \
              -e 's#Lcom/affilemanager/app#Lcom/shovel/filemanager#g' \
              -e 's#Lcom/affilemanager/#Lcom/shovel/#g' \
              -e 's#com/affilemanager/app#com/shovel/filemanager#g' \
              "$f"
          done

          # 3. Fail loudly if anything is left.
          if grep -rIn -E 'com[./]affilemanager' . --exclude-dir=.git; then
            echo "Old package references remain" >&2
            exit 1
          fi
          if find . -type d -path '*/com/affilemanager*' -not -path './.git/*' | grep -q .; then
            echo "Old package directories remain" >&2
            exit 1
          fi
          echo "Rename complete"


      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Rename package to com.shovel.filemanager"
          git push
