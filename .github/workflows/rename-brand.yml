name: Rename brand

# One-time helper. Replaces every "AF File Manager", "AF" and "Af" mention with Shovel
# (code names, file names, text, build settings) and commits the result.
# LICENSE and README.md are left alone on purpose.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rename brand
        shell: bash
        run: |
          # Replaces every "AF File Manager" / "AF" / "Af" brand mention with Shovel.
          # LICENSE and README.md are left alone on purpose (license notice and attribution).
          set -euo pipefail

          SUBST='
          s{sinegard/AF-File-Manager}{GemmKen49/Shovel-File-Manager-Tool}g;
          s{AF File Manager}{Shovel}g;
          s{AF-File-Manager}{Shovel}g;
          s{AFFileManager}{Shovel}g;
          s{af[-_]file[-_]manager}{shovel}g;
          s{(?<![A-Za-z0-9])Af(?=[A-Z])}{Shovel}g;
          s{(?<=[a-z0-9])Af(?=[A-Z])}{Shovel}g;
          s{(?<![A-Za-z0-9])AF(?=[A-Z][a-z])}{Shovel}g;
          s{(?<![A-Za-z0-9])AF(?=[-_][A-Z]{2})}{SHOVEL}g;
          s{(?<![A-Za-z0-9])AF(?![A-Za-z0-9])}{Shovel}g;
          s{(?<![A-Za-z0-9])af(?=[A-Z])}{shovel}g;
          s{(?<![A-Za-z0-9])af(?![A-Za-z0-9])}{shovel}g;
          '

          # 1. File contents (skip .git, .github, LICENSE, README.md, binaries).
          grep -rIlE 'AF|Af|af' . \
            --exclude-dir=.git --exclude-dir=.github --exclude=LICENSE --exclude=README.md \
            | while read -r f; do
                perl -CSD -pi -e "$SUBST" "$f"
              done

          # 2. Workflow: rename env var names and the Gradle property, keep the repository secret names untouched.
          wf=.github/workflows/debug-apk.yml
          if [ -f "$wf" ]; then
            perl -CSD -pi -e 's{^(\s*)AF_([A-Z_]+):}{$1SHOVEL_$2:}; s{-Paf(?=[A-Z])}{-Pshovel}g' "$wf"
          fi

          # 3. File names.
          find . -type f -not -path './.git/*' -not -path './.github/*' \( -name 'Af*' -o -name 'AFFileManager*' \) | while read -r p; do
            dir="$(dirname "$p")"; base="$(basename "$p")"
            new="$(printf '%s' "$base" | perl -CSD -pe "$SUBST")"
            if [ "$new" != "$base" ]; then mv "$p" "$dir/$new"; fi
          done

          # 4. Fail loudly if anything is left (the secrets.AF_* names are the one exception).
          left="$(grep -rInP '(?<![A-Za-z0-9])(AF|Af|af)(?![A-Za-z0-9])|(?<![A-Za-z0-9])AF(?=[A-Z][a-z])|(?<![A-Za-z0-9])Af(?=[A-Z])|(?<=[a-z0-9])Af(?=[A-Z])|(?<![A-Za-z0-9])af(?=[A-Z])|AFFile|af-file-manager' . \
            --exclude-dir=.git --exclude-dir=.github --exclude=LICENSE --exclude=README.md || true)"
          if [ -n "$left" ]; then echo "$left" | head -30; echo "AF mentions remain" >&2; exit 1; fi
          if find . -type f -not -path './.git/*' \( -name 'Af*' -o -name 'AFFileManager*' \) | grep -q .; then
            echo "AF-named files remain" >&2; exit 1
          fi
          echo "Brand rename complete"


      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Rename AF to Shovel"
          git push
